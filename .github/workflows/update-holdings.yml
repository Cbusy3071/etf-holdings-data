name: Update ETF Holdings

on:
  workflow_dispatch:

  schedule:
    - cron: "7 6 * * 1"
      timezone: "Australia/Sydney"

permissions:
  contents: write

jobs:
  update-holdings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install pandas requests

      - name: Create output directory
        run: mkdir -p data

      - name: Download ETF holdings
        run: |
          python update_holdings.py \
            --out-dir data \
            --no-per-fund \
            --combined-name ETF_Holdings_Latest.csv \
            VGT ACWI XLF XLI XLC PPH MLPX GRID SOXQ

      - name: Confirm output exists
        run: |
          test -s data/ETF_Holdings_Latest.csv

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ETF_Holdings_Latest.csv

          if git diff --cached --quiet; then
            echo "No holdings changes detected."
          else
            git commit -m "Update ETF holdings $(date -u +'%Y-%m-%d')"
            git push
          fi