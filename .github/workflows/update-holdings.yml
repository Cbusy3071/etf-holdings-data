name: Update ETF Holdings

on:
  workflow_dispatch:

  schedule:
  - cron: "7 0 * * 2-6"  # 10:07 Australia/Sydney during AEST (UTC+10)
  - cron: "7 23 * * 1-5" # 10:07 Australia/Sydney during AEDT (UTC+11)

permissions:
  contents: write

concurrency:
  group: etf-holdings-update
  cancel-in-progress: false

jobs:
  update-holdings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
         

      - name: Install dependencies
        run: pip install pandas requests

      - name: Create output directory
        run: mkdir -p data

      - name: Download ETF holdings
        run: |
          python update_holdings.py \
            --out-dir data \
            --no-per-fund \
            --combined-name ETF_Holdings_Latest.csv \
            VGT ACWI XLF XLI XLC PPH MLPX GRID SOXQ

      - name: Confirm output exists
        run: |
          test -s data/ETF_Holdings_Latest.csv

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the newly generated CSV outside the repository.
          cp data/ETF_Holdings_Latest.csv /tmp/ETF_Holdings_Latest.csv

          # Retry if main changes between fetching and pushing.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp /tmp/ETF_Holdings_Latest.csv data/ETF_Holdings_Latest.csv
            git add data/ETF_Holdings_Latest.csv

            if git diff --cached --quiet; then
              echo "No holdings changes detected."
              exit 0
            fi

            git commit -m "Update ETF holdings $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Holdings CSV successfully published."
              exit 0
            fi

            echo "Remote branch changed before push. Retrying..."
            sleep 3
          done

          echo "Failed to publish after three attempts."
          exit 1
