name: Update ETF Holdings

on:
  # Allows you to test it manually from the Actions tab.
  workflow_dispatch:

  # Runs every Monday at 6:07 am Sydney time.
  schedule:
    - cron: "7 6 * * 1"
      timezone: "Australia/Sydney"

permissions:
  contents: write

jobs:
  update-holdings:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate holdings CSV
        run: python update_holdings.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ETF_Holdings_Latest.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update ETF holdings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi