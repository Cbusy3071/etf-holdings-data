name: Test scraper

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install lxml
      - name: Syntax and parser regression tests
        run: |
          python -m py_compile update_holdings.py run_update.py vgt_profile_pcf.py globalx_holdings.py
          python -m unittest -v test_globalx_holdings.py
